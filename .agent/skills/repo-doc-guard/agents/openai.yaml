interface:
  display_name: "Repo Doc Guard"
  short_description: "Apply the right baseline for repo and module docs"
  default_prompt: "Before editing repository documentation, inspect the current docs and the files they describe. Treat `readme.md`, `COMPONENTS.md`, repo navigation, and build/package-facing docs or metadata as formal docs that default to committed repository scope. Treat same-name `core/*.md` and `device/*.md` module docs as formal docs that should reflect the latest matching source/header behavior. Keep process-status notes out of formal docs; put temporary maintenance notes under `docs/records/` only when needed."
